---
name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  determine_unit_tests_trigger:
    name: Determine whether unit tests should run
    runs-on: ubuntu-latest
    outputs:
      python_changed: ${{ steps.filter.outputs.python }}
      ci_changed: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect changed Python or CI files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            python:
              - '**/*.py'
            ci:
              - '.github/workflows/**'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - name: Install dependencies
        run: pip install tox
      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-
      - name: Run linting
        run: tox -e lint

  tests:
    name: Unit tests (Python ${{ matrix.python_version }})
    needs:
      - determine_unit_tests_trigger
      - lint
    if: needs.determine_unit_tests_trigger.outputs.python_changed == 'true' || needs.determine_unit_tests_trigger.outputs.ci_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: '3.10'
            tox_env: py310
          - python_version: '3.11'
            tox_env: py311
          - python_version: '3.12'
            tox_env: py312
          - python_version: '3.13'
            tox_env: py313
          - python_version: '3.14'
            tox_env: py314
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
      - name: Install tox
        run: pip install tox
      - name: Run unit tests
        run: tox -e ${{ matrix.tox_env }}
      - name: Upload coverage to Codecov
        if: matrix.python_version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
