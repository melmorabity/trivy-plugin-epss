---
name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  determine_unit_tests_trigger:
    name: Determine which tests should run
    runs-on: ubuntu-latest
    outputs:
      python_changed: ${{ steps.filter.outputs.python }}
      ci_changed: ${{ steps.filter.outputs.ci }}
      plugin_changed: ${{ steps.filter.outputs.plugin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Detect changed Python, CI or plugin files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            python:
              - '**/*.py'
            ci:
              - '.github/workflows/**'
            plugin:
              - 'plugin.yaml'
              - 'tests/**'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.15'
          enable-cache: true
          cache-python: true
          cache-suffix: lint
      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-
      - name: Run linting
        run: uvx --with tox-uv tox -e lint

  tests:
    name: Unit tests
    needs:
      - determine_unit_tests_trigger
      - lint
    if: needs.determine_unit_tests_trigger.outputs.python_changed == 'true' || needs.determine_unit_tests_trigger.outputs.ci_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-python: true
          cache-suffix: tests
      - name: Run unit tests
        run: uvx --with tox-uv tox
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e_tests:
    name: End-to-end tests
    needs:
      - determine_unit_tests_trigger
      - lint
    if: |
      needs.determine_unit_tests_trigger.outputs.python_changed == 'true' ||
      needs.determine_unit_tests_trigger.outputs.ci_changed == 'true' ||
      needs.determine_unit_tests_trigger.outputs.plugin_changed == 'true'
    strategy:
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: false
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
      - name: Install the plugin
        run: trivy plugin install .
      - name: Scan Log4Shell with EPSS data
        run: |
          trivy sbom --format json --output plugin=epss tests/log4shell.cdx.json \
            | jq -e '.Results[].Vulnerabilities[] | select(.VulnerabilityID == "CVE-2021-44228") | .EPSS.score > 0'

  # Skipped matrix jobs never report their per-version checks, so require this
  # single check instead
  e2e_tests_result:
    name: End-to-end tests result
    needs: e2e_tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check end-to-end tests result
        env:
          RESULT: ${{ needs.e2e_tests.result }}
        run: '[[ "$RESULT" == success || "$RESULT" == skipped ]]'

  auto_merge:
    name: Auto-merge pre-commit.ci pull request
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'pre-commit-ci[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --rebase "$PR_URL"
